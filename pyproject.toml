[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-budget-guard"
version = "0.2.0"
description = "Enforce a cumulative spend cap across Claude Code resumes, with quota-aware auto-wake"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "hao li", email = "haoli5933@gmail.com"}]
keywords = ["claude-code", "budget", "cost-control", "ai-agents", "quota"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/resume-budget-guard"
Issues = "https://github.com/hahahahahahahahah6/resume-budget-guard/issues"

[project.scripts]
rbg = "resume_budget_guard:main"

[tool.setuptools]
py-modules = ["resume_budget_guard"]
